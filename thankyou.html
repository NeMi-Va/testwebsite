<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You!</title>
    <style>
        /* Reset default margin/padding */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; /* full viewport height */
            text-align: center;
        }

        .thank-you-message {
            background: #ffffff;
            padding: 60px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            max-width: 700px;
            width: 90%;
        }

        .thank-you-message h1 {
            font-size: 3rem;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .thank-you-message p {
            font-size: 1.2rem;
            color: #2c3e50;
        }

        @media (max-width: 600px) {
            .thank-you-message h1 {
                font-size: 2.2rem;
            }
            .thank-you-message p {
                font-size: 1rem;
            }
            .thank-you-message {
                padding: 40px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="thank-you-message">
        <h1>Thank You!</h1>
        <p>Your submission has been received successfully.<br>We will get back to you shortly.</p>
    </div>

</body>
</html>
